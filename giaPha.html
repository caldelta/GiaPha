<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gia Phả Họ Huỳnh Văn – Huỳnh Khắc (1800–1997)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c8960c;--gold-light:#ffd700;--gold-dim:rgba(200,150,12,0.35);
  --bg:#07070f;--text:#f0e6c8;
}
html{height:100%}
body{
  margin:0;height:100vh;display:flex;flex-direction:column;
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Tahoma,sans-serif;
}

/* ─── HEADER ─────────────────────────────────── */
#hdr{
  display:flex;align-items:center;gap:14px;padding:6px 16px;
  background:linear-gradient(135deg,#0d0000,#2a1200,#0d0000);
  border-bottom:2px solid var(--gold);
  box-shadow:0 2px 24px rgba(200,150,12,.4);
  flex-shrink:0;z-index:200;
}
#hdr h1{font-size:1.15em;color:var(--gold-light);text-shadow:0 0 18px rgba(255,215,0,.5);white-space:nowrap;line-height:1.3}
#hdr p{font-size:.68em;color:var(--gold);white-space:nowrap}
.hdr-divider{width:1px;height:32px;background:var(--gold-dim);flex-shrink:0}

/* search */
.srch-wrap{position:relative;width:260px;flex-shrink:0}
#srchInput{
  width:100%;padding:6px 34px 6px 13px;
  background:rgba(255,255,255,.08);border:1px solid var(--gold);
  border-radius:20px;color:var(--text);font-size:.82em;outline:none;transition:.25s;
}
#srchInput:focus{background:rgba(255,255,255,.14);border-color:var(--gold-light);box-shadow:0 0 10px rgba(255,215,0,.3)}
#srchInput::placeholder{color:rgba(240,230,200,.45)}
#srchList{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:#141428;border:1px solid var(--gold);border-radius:8px;
  max-height:280px;overflow-y:auto;z-index:500;display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.7);
}
#srchList.show{display:block}
.sri{padding:7px 13px;cursor:pointer;border-bottom:1px solid rgba(200,150,12,.18);transition:background .15s;font-size:.79em}
.sri:hover{background:rgba(200,150,12,.2)}
.sri-name{color:var(--gold-light);font-weight:700}
.sri-sub{color:var(--gold);font-size:.88em;margin-top:1px}

/* stats chips */
.chips{display:flex;gap:7px;margin-left:auto;flex-shrink:0}
.chip{background:rgba(10,10,26,.8);border:1px solid var(--gold-dim);border-radius:20px;padding:3px 10px;font-size:.68em;color:var(--gold);white-space:nowrap}
.chip b{color:var(--gold-light)}

/* ─── MAIN / SVG ──────────────────────────────── */
/* #main fills ALL remaining height, no flex sibling shrinkage */
#main{
  position:relative;   /* anchor for absolutely-positioned panel */
  flex:1 1 0;          /* take all remaining vertical space      */
  min-height:0;        /* critical: allow flex child to shrink   */
  overflow:hidden;
}
/* SVG wrapper = full area of #main */
#svgWrap{
  position:absolute;
  inset:0;             /* top:0;right:0;bottom:0;left:0          */
}
#treeSvg{display:block;width:100%;height:100%}

/* ─── LINKS ───────────────────────────────────── */
.link{
  fill:none;stroke:rgba(200,150,12,.25);stroke-width:1.5;
  transition:stroke .45s,stroke-width .3s,opacity .45s;
}
.link.hl{stroke:var(--gold-light);stroke-width:3;filter:drop-shadow(0 0 4px rgba(255,215,0,.7))}
.link.dim{opacity:.07}

/* ─── NODES ───────────────────────────────────── */
.node{cursor:pointer;transition:opacity .35s}
.node.dim{opacity:.12}
.nBg{rx:7;ry:7;transition:fill .3s,stroke .3s,filter .3s}
.nBg:hover{filter:brightness(1.3)}
.node.sel .nBg{stroke:var(--gold-light)!important;stroke-width:3;filter:drop-shadow(0 0 10px rgba(255,215,0,.9))}
.node.hl .nBg{stroke:var(--gold-light)!important;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(255,215,0,.6))}
.node.sm .nBg{stroke:#00ff88!important;stroke-width:2.5;filter:drop-shadow(0 0 7px rgba(0,255,136,.7))}

/* Gen colours */
.g1 .nBg{fill:#3a0808;stroke:#8B0000}
.g2 .nBg{fill:#2d1500;stroke:#B8860B}
.g3 .nBg{fill:#1e1200;stroke:#CD8830}
.g4 .nBg{fill:#061a0f;stroke:#2E8B57}
.g5 .nBg{fill:#061422;stroke:#4682B4}
.g6 .nBg{fill:#12082a;stroke:#7B68EE}
.g7 .nBg{fill:#0f0f0f;stroke:#778899}
.g8 .nBg{fill:#0a0a0a;stroke:#556B2F}

.nName{font-size:9.5px;font-weight:700;fill:var(--text);dominant-baseline:middle;text-anchor:middle;pointer-events:none}
.nSub{font-size:7.5px;fill:var(--gold);dominant-baseline:middle;text-anchor:middle;pointer-events:none}
.nPls{font-size:8px;fill:var(--gold-light);dominant-baseline:middle;text-anchor:middle;pointer-events:none;font-weight:700}

/* female tint */
.female .nBg{opacity:.92}
.female .nName{fill:#fde8d8}

/* ─── DETAILS PANEL (absolute overlay, right side) ── */
#panel{
  position:absolute;top:0;right:0;bottom:0;
  width:320px;
  background:linear-gradient(180deg,#0c0c1e,#150800);
  border-left:2px solid var(--gold);
  padding:18px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(.25,.46,.45,.94);
  z-index:100;
}
#panel.open{transform:translateX(0)}
#pClose{
  position:absolute;top:10px;right:10px;
  background:rgba(200,150,12,.18);border:1px solid var(--gold);
  color:var(--gold-light);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
#pClose:hover{background:rgba(200,150,12,.4)}
.pAvatar{
  width:72px;height:72px;border-radius:50%;margin:6px auto 12px;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  border:3px solid var(--gold);box-shadow:0 0 20px rgba(200,150,12,.5);
}
.pName{text-align:center;font-size:1.05em;font-weight:700;color:var(--gold-light);margin-bottom:3px}
.pGen{text-align:center;font-size:.72em;color:var(--gold);margin-bottom:14px}
.pGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pCard{
  background:rgba(255,255,255,.04);border:1px solid rgba(200,150,12,.2);
  border-radius:7px;padding:8px;text-align:center;
}
.pLabel{font-size:.62em;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.pVal{font-size:.8em;color:var(--text);font-weight:700}
.pSect{font-size:.68em;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.pSect::after{content:'';flex:1;height:1px;background:rgba(200,150,12,.3)}
.pNote{font-size:.78em;color:#c8b898;line-height:1.65;background:rgba(255,255,255,.03);border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 5px 5px 0}
.pSpouse{font-size:.8em;color:#f0d0a0;padding:7px 10px;background:rgba(200,150,12,.1);border-radius:6px;margin-bottom:10px}
.pIntro{
  font-size:.74em;color:#d4c49a;line-height:1.7;
  background:linear-gradient(135deg,rgba(200,150,12,.12),rgba(139,0,0,.1));
  border:1px solid rgba(200,150,12,.35);border-radius:8px;
  padding:10px 12px;margin-bottom:14px;
  white-space:pre-wrap;
}
.pChildList{list-style:none}
.pChi{
  display:flex;align-items:center;gap:7px;padding:5px 8px;
  border-radius:5px;cursor:pointer;transition:background .15s;font-size:.78em;color:var(--text);
}
.pChi:hover{background:rgba(200,150,12,.15);color:var(--gold-light)}
.cDot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}

/* ─── LEGEND ──────────────────────────────────── */
#legend{
  position:absolute;bottom:14px;left:14px;
  background:rgba(7,7,15,.9);border:1px solid rgba(200,150,12,.4);
  border-radius:10px;padding:10px 14px;z-index:50;
}
.legTitle{font-size:.65em;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.legItem{display:flex;align-items:center;gap:7px;font-size:.68em;color:var(--text);margin-bottom:3px}
.legDot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* ─── ZOOM BTNS ───────────────────────────────── */
#zbtns{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:50}
.zbtn{
  width:34px;height:34px;background:rgba(7,7,15,.9);
  border:1px solid rgba(200,150,12,.4);border-radius:7px;
  color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all .2s;
}
.zbtn:hover{background:rgba(200,150,12,.2);color:var(--gold-light);border-color:var(--gold-light)}

/* ─── TOOLTIP ─────────────────────────────────── */
#tip{
  position:fixed;background:rgba(7,7,15,.97);border:1px solid var(--gold);
  border-radius:8px;padding:8px 12px;font-size:.75em;color:var(--text);
  pointer-events:none;z-index:900;max-width:210px;display:none;
  box-shadow:0 4px 20px rgba(0,0,0,.8);
}
#tip .tName{color:var(--gold-light);font-weight:700;margin-bottom:3px}
#tip .tInfo{color:var(--gold)}

/* ─── SCROLLBAR ───────────────────────────────── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:rgba(200,150,12,.35);border-radius:3px}

/* ─── ANIMATION ───────────────────────────────── */
@keyframes goldenPulse{
  0%,100%{filter:drop-shadow(0 0 4px rgba(255,215,0,.4))}
  50%{filter:drop-shadow(0 0 14px rgba(255,215,0,1))}
}
.node.sel{animation:goldenPulse 2s ease-in-out infinite}
</style>
</head>

          intro:"◇ CHI TỔ ĐỜI 3 – HUỲNH THỊ TẦM VÀ HẬU DUỆ\n\nBà Huỳnh Thị Tầm là con thứ 5 (T5) của Tổ Đ2 Huỳnh Văn Hơn. Tài liệu gia phả không ghi ngày sinh và ngày mất. Bà có chồng họ Ngô, sinh 3 người con: Ngô Văn Viêm (T2), Ngô Thị Sầm (T3), Ngô Thị Quế (T4).\n\nMột câu chuyện thú vị: Hai ông Sửu và Thình (cháu bà Tầm) đã tạo ra một giai thoại buồn cười: 'Một hôm thừa nhân túi, đến khoanh tay trước mặt ông ngoại tôi (ông Huỳnh Khắc Đầu) tỏ ra rầu rỉ, bị thương, nói: Thứa cậu Bay, con buồn quá vì vợ con mới chết mà không có tiền chôn cất, con nhờ cậu Bay giúp đỡ. Dĩ nhiên ông ngoại tôi phải chi ra; sau hỏi lại thì ông ta đâu có chết vợ bao giờ; thì ta hai ông dùng cậu chuyện để kiếm tiền chơi tiếp.'",

          intro:"◇ CHI TỔ ĐỜI 3 – HUỲNH THỊ KIÊM VÀ HẬU DUỆ\n\nBà Cố Huỳnh Thị Kiêm là con thứ 6 (T6) của Tổ Đ2 Huỳnh Văn Hơn. Bà sinh năm 1857 (Đinh Tỵ), mất ngày 26-2 Nhâm Tuất (24-3-1922), hưởng thọ 66 tuổi. Bà có chồng là ông huyện hàm Nguyễn Văn Ngạn (cũng sinh năm 1857, mất năm Bính Dần 1926, thọ 70 tuổi). Hai ông bà được mai táng tại nhà mồ cao rộng ở xã Phú An Hòa, huyện Châu Thành, Bến Tre.\n\nSự giàu có của gia đình này có truyền thuyết mà người dân Phú An Hòa đều biết: Ấy là một ngày xa xưa, có hai cha con ông Nguyễn Thanh Phong đến lập nghiệp tại vùng đất xã Phú An Hòa ngày nay. Hồi cha chết, ông Hiệp có vợ sinh 10 người con, mà ông Nguyễn Văn Ngạn là người con út thứ 11 đã cưới bà Huỳnh Thị Kiêm. Cuộc sống gia đình ông bà gặp nhiều khó khăn. Bà Kiêm là đầu tàu gánh vác. Ông Hiệp ngày ngày đi kiếm tôm cá. Chẳng bao lâu gia đã khá giàu rồi trở nên giàu có. Người ta nói là ông Hiệp đặt nò mà được vàng nên danh truyền là ông Hiệp Nò, hưởng lấy, ông bà sau này đưa tay phải búng qua vàng. Ông bà có 6 con:\n\n– D4.T2 & T3: Không biết\n– D4.T4: Nguyễn Thị Trịnh (chồng Hội đồng Mai Văn Nhiêu, 6 con)\n– D4.T5: Nguyễn Thị Tiết\n– D4.T6: Nguyễn Thanh Liêm (sinh 15-8-1887, mất 18-1-1968)\n– D4.T7: Nguyễn Thị Nhuận (chồng Hội đồng Lê Văn Giải, 7 con)",

const allNodes = [];
function flatten(node, parentId=null){
  node._parentId = parentId;
  allNodes.push(node);
  if(node.children) node.children.forEach(c => flatten(c, node.id));
}

/* ══════════════════════════════════════════════════════
   D3 TREE SETUP
══════════════════════════════════════════════════════ */
/* Node dimensions + spacing — HORIZONTAL tree (left → right) */
const NW = 148, NH = 38, HDIST = 250, VGAP = 8;
const svg = d3.select('#treeSvg');
const wrap = document.getElementById('svgWrap');
const gMain = svg.append('g').attr('class','treeRoot');

const zoomBehavior = d3.zoom().scaleExtent([0.06,3])
  .on('zoom', e => gMain.attr('transform', e.transform));
svg.call(zoomBehavior).on('dblclick.zoom', null);

let nodeUid = 0;
let selectedNode = null;

/* collapse/expand state: keep _children when collapsed */
function collapseNode(d){
  if(d.children){d._children=d.children;d.children=null}
}
function expandNode(d){
  if(d._children){d.children=d._children;d._children=null}
}
function collapseDeep(d, depth=0, threshold=4){
  if(depth>=threshold) collapseNode(d);
  else if(d.children) d.children.forEach(c=>collapseDeep(c,depth+1,threshold));
  if(d._children) d._children.forEach(c=>collapseDeep(c,depth+1,threshold));
}
function expandAll(d){
  expandNode(d);
  if(d.children) d.children.forEach(expandAll);
  if(d._children) d._children.forEach(expandAll);
}
function collapseAll(d, keep=2, depth=0){
  if(depth>=keep) collapseNode(d);
  if(d.children) d.children.forEach(c=>collapseAll(c,keep,depth+1));
}

/* init: collapse beyond depth 3 */
const rootData = DATA;
collapseDeep(rootData, 0, 3);

/* ─── UPDATE ─────────────────────────────────────── */
/* HORIZONTAL tree: d.y = depth (→ right), d.x = vertical position */
function makeTree(){ return d3.tree().nodeSize([NH+VGAP, HDIST]); }
const diagonal = d3.linkHorizontal().x(d=>d.y).y(d=>d.x);

function update(source, animate=true){
  const dur = animate ? 500 : 0;
  const hierarchy = d3.hierarchy(rootData, d=>d.children);
  makeTree()(hierarchy);

  const nodes = hierarchy.descendants();
  const links = hierarchy.links();

  /* ── LINKS ── */
  const link = gMain.selectAll('path.link').data(links, d=>d.target.data.id);

  link.enter().append('path').attr('class','link')
    .attr('d', d=>{const o={x:source._x0||0, y:source._y0||0}; return diagonal({source:o,target:o})})
    .merge(link)
    .transition().duration(dur)
    .attr('d', diagonal);

  link.exit().transition().duration(dur)
    .attr('d', d=>{const o={x:source.x,y:source.y}; return diagonal({source:o,target:o})})
    .remove();

  /* ── NODES ── */
  const node = gMain.selectAll('g.node').data(nodes, d=>d.data.id);

  const nodeEnter = node.enter().append('g')
    .attr('class', d=>`node g${d.data.gen} ${d.data.gender==='female'?'female':''}`)
    .attr('transform', d=>`translate(${source._y0||0},${source._x0||0})`)
    .on('click', (evt,d)=>{ evt.stopPropagation(); handleClick(d); })
    .on('mouseenter', (evt,d)=>showTip(evt,d))
    .on('mouseleave', hideTip);

  nodeEnter.append('rect').attr('class','nBg')
    .attr('width',NW).attr('height',NH)
    .attr('x',-NW/2).attr('y',-NH/2);

  /* name (possibly 2 lines) */
  nodeEnter.each(function(d){
    const g = d3.select(this);
    const nm = d.data.name;
    const words = nm.split(' ');
    if(nm.length<=16){
      g.append('text').attr('class','nName').attr('dy',d.data.gen<=2?'-3':'0').text(nm);
      if(d.data.gen<=3 && d.data.title){
        g.append('text').attr('class','nSub').attr('dy','12').text(d.data.title);
      }
    } else {
      const mid = Math.ceil(words.length/2);
      g.append('text').attr('class','nName').attr('dy','-5').text(words.slice(0,mid).join(' '));
      g.append('text').attr('class','nName').attr('dy','6').text(words.slice(mid).join(' '));
    }
    if(d.data.gen<=2){
      g.append('text').attr('class','nSub').attr('dy','14').text(`Đời ${d.data.gen}`);
    }
    /* small "◆" badge on nodes that have an intro paragraph */
    if(d.data.intro){
      g.append('text').attr('class','nSub')
        .attr('dy','-12').attr('dx',-NW/2+8)
        .attr('text-anchor','start')
        .attr('fill','rgba(255,215,0,.8)').attr('font-size','7px')
        .text('◆ Chi họ');
    }
  });

  /* collapse indicator – right edge of node */
  nodeEnter.append('text').attr('class','nPls').attr('dy','0').attr('dx', NW/2-8)
    .text(d=>(d.data._children&&d.data._children.length)?'▶':'');

  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(dur)
    .attr('class', d=>`node g${d.data.gen} ${d.data.gender==='female'?'female':''}`)
    .attr('transform', d=>`translate(${d.y},${d.x})`);  /* horizontal: y=depth, x=vertical */

  nodeUpdate.select('.nPls')
    .text(d=>(d.data._children&&d.data._children.length)?'▶':'');

  node.exit().transition().duration(dur)
    .attr('transform', d=>`translate(${source.y},${source.x})`)
    .remove();

  /* store positions for next transition */
  nodes.forEach(d=>{ d.data._x0=d.x; d.data._y0=d.y; });

  /* re-apply highlights */
  if(selectedNode) highlightAncestors(selectedNode);
}

/* ─── CLICK ──────────────────────────────────────── */
function handleClick(d){
  /* toggle collapse */
  if(d.data._children && d.data._children.length){
    expandNode(d.data); update(d.data);
  } else if(d.data.children && d.data.children.length){
    collapseNode(d.data); update(d.data);
  }
  selectedNode = d;
  showPanel(d.data);
  highlightAncestors(d);
}

function highlightAncestors(d){
  /* build ancestor id set */
  const ancs = new Set(d.ancestors().map(n=>n.data.id));
  gMain.selectAll('g.node')
    .classed('hl', n=>ancs.has(n.data.id) && n.data.id!==d.data.id)
    .classed('sel', n=>n.data.id===d.data.id)
    .classed('dim', n=>!ancs.has(n.data.id));
  gMain.selectAll('path.link')
    .classed('hl', l=>ancs.has(l.source.data.id) && ancs.has(l.target.data.id))
    .classed('dim', l=>!(ancs.has(l.source.data.id) && ancs.has(l.target.data.id)));
}

function clearHighlights(){
  gMain.selectAll('g.node').classed('hl sel dim sm',false);
  gMain.selectAll('path.link').classed('hl dim',false);
  selectedNode=null;
  document.getElementById('panel').classList.remove('open');
}

svg.on('click', clearHighlights);

/* ─── TOOLTIP ─────────────────────────────────────── */
const tip = document.getElementById('tip');
function showTip(evt, d){
  const nd = d.data;
  document.getElementById('tipName').textContent = nd.name;
  let info = `Đời ${nd.gen}`;
  if(nd.birth) info += ` · ${nd.birth}`;
  if(nd.death) info += ` – ${nd.death}`;
  if(nd.spouse) info += `\nVợ/chồng: ${nd.spouse}`;
  document.getElementById('tipInfo').textContent = info;
  tip.style.display='block';
  moveTip(evt);
}
function moveTip(evt){
  tip.style.left = Math.min(evt.clientX+14, window.innerWidth-220)+'px';
  tip.style.top  = Math.min(evt.clientY+14, window.innerHeight-80)+'px';
}
function hideTip(){ tip.style.display='none'; }
svg.on('mousemove', moveTip);

  cont.innerHTML = `
    ${introHtml}
    <div class="pAvatar" style="background:${color}22;border-color:${color}">${emoji}</div>
    <div class="pName">${nd.name}</div>
    <div class="pGen">Đời ${nd.gen}${nd.title?` · ${nd.title}`:''}</div>
    <div class="pGrid">
      <div class="pCard"><div class="pLabel">Sinh</div><div class="pVal">${birth}</div></div>
      <div class="pCard"><div class="pLabel">Mất</div><div class="pVal">${death}</div></div>
      ${age?`<div class="pCard"><div class="pLabel">Thọ</div><div class="pVal">${age}</div></div>`:''}
      <div class="pCard"><div class="pLabel">Giới tính</div><div class="pVal">${nd.gender==='male'?'Nam':nd.gender==='female'?'Nữ':'Không rõ'}</div></div>
      <div class="pCard"><div class="pLabel">Con cái</div><div class="pVal">${allChildren.length} người</div></div>
      ${resHtml}
    </div>
    ${nd.spouse?`<div class="pSect">Vợ / Chồng</div><div class="pSpouse">💑 ${nd.spouse}</div>`:''}
    ${nd.notes?`<div class="pSect">Tiểu sử</div><div class="pNote">${nd.notes.replace(/\n/g,'<br>')}</div>`:''}
    ${childrenHtml}
  `;
  panel.classList.add('open');
}

document.getElementById('pClose').addEventListener('click', ()=>{
  document.getElementById('panel').classList.remove('open');
  clearHighlights();
});

/* jump to node from panel child list */
window.jumpToNode = function(id){
  const h2 = d3.hierarchy(rootData, d=>d.children);
  makeTree()(h2);
  const found = h2.descendants().find(d=>d.data.id===id);
  if(!found) return;
  handleClick(found);
  const main = document.getElementById('main');
  const tx = main.clientWidth/2  - found.y;
  const ty = main.clientHeight/2 - found.x;
  svg.transition().duration(600).call(zoomBehavior.transform,
    d3.zoomIdentity.translate(tx,ty).scale(1.3));
};

/* ─── SEARCH ──────────────────────────────────────── */
const srchInput = document.getElementById('srchInput');
const srchList  = document.getElementById('srchList');

srchInput.addEventListener('input', ()=>{
  const q = srchInput.value.trim().toLowerCase();
  srchList.innerHTML='';
  if(!q){srchList.classList.remove('show');clearSearchHighlight();return;}
  const matches = allNodes.filter(n=>
    n.name.toLowerCase().includes(q) ||
    (n.notes&&n.notes.toLowerCase().includes(q)) ||
    (n.intro&&n.intro.toLowerCase().includes(q)) ||
    (n.spouse&&n.spouse.toLowerCase().includes(q)) ||
    (n.residence&&n.residence.toLowerCase().includes(q))
  ).slice(0,20);
  if(!matches.length){srchList.classList.remove('show');return;}
  matches.forEach(m=>{
    const div=document.createElement('div'); div.className='sri';
    div.innerHTML=`<div class="sri-name">${highlight(m.name,q)}</div>
      <div class="sri-sub">Đời ${m.gen}${m.birth?' · Sinh: '+m.birth:''}${m.spouse?' · '+m.spouse:''}</div>`;
    div.addEventListener('click',()=>{ selectSearchResult(m.id); srchList.classList.remove('show'); srchInput.value=m.name; });
    srchList.appendChild(div);
  });
  srchList.classList.add('show');
  highlightSearch(matches.map(m=>m.id));
});

function highlight(str, q){
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi');
  return str.replace(re,'<mark style="background:rgba(255,215,0,.35);color:#ffd700">$1</mark>');
}

function highlightSearch(ids){
  const idSet=new Set(ids);
  gMain.selectAll('g.node')
    .classed('sm', d=>idSet.has(d.data.id))
    .classed('dim', d=>!idSet.has(d.data.id));
  gMain.selectAll('path.link').classed('dim',true);
}
function clearSearchHighlight(){
  gMain.selectAll('g.node').classed('sm dim',false);
  gMain.selectAll('path.link').classed('dim',false);
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.srch-wrap')){
    srchList.classList.remove('show');
  }
});

function selectSearchResult(id){
  /* expand path to target */
  function expandPath(data, targetId){
    if(data.id===targetId) return true;
    const kids=(data.children||[]).concat(data._children||[]);
    for(const c of kids){
      if(expandPath(c,targetId)){
        expandNode(data); return true;
      }
    }
    return false;
  }
  expandPath(rootData, id);
  update(rootData, false);
  /* find in recomputed hierarchy */
  const h2 = d3.hierarchy(rootData, d=>d.children);
  makeTree()(h2);
  const found = h2.descendants().find(d=>d.data.id===id);
  if(!found) return;
  handleClick(found);
  const mainEl = document.getElementById('main');
  const tx = mainEl.clientWidth/2  - found.y;
  const ty = mainEl.clientHeight/2 - found.x;
  svg.transition().duration(700).call(zoomBehavior.transform,
    d3.zoomIdentity.translate(tx,ty).scale(1.4));
  clearSearchHighlight();
}

/* ─── ZOOM CONTROLS ───────────────────────────────── */
document.getElementById('zIn').addEventListener('click',
  ()=>svg.transition().duration(300).call(zoomBehavior.scaleBy,1.4));
document.getElementById('zOut').addEventListener('click',
  ()=>svg.transition().duration(300).call(zoomBehavior.scaleBy,.72));
document.getElementById('zFit').addEventListener('click', fitTree);
document.getElementById('zExp').addEventListener('click', ()=>{
  expandAll(rootData); update(rootData); setTimeout(()=>{addGenLabels();fitTree();},550);
});
document.getElementById('zCol').addEventListener('click', ()=>{
  collapseAll(rootData,2); update(rootData); setTimeout(()=>{addGenLabels();fitTree();},550);
});

function fitTree(){
  const bounds = gMain.node().getBBox();
  if(!bounds.width) return;
  const main = document.getElementById('main');
  const w = main.clientWidth, h = main.clientHeight;
  const pad = 50;
  const scale = Math.min(.92, Math.min(w/(bounds.width+pad*2), h/(bounds.height+pad*2)));
  const tx = w/2 - scale*(bounds.x + bounds.width/2);
  const ty = h/2 - scale*(bounds.y + bounds.height/2);
  svg.transition().duration(700).call(zoomBehavior.transform,
    d3.zoomIdentity.translate(tx,ty).scale(scale));
}

/* ══════════════════════════════════════════════════════
   INITIAL RENDER
══════════════════════════════════════════════════════ */
update(rootData, false);

/* initial fit after short delay */
setTimeout(()=>{
  fitTree();
  /* add decorative generation column headers */
  addGenLabels();
},300);

/* Horizontal tree → generation labels are vertical columns.
   Each gen's d.y = horizontal position (depth). Draw label above each column. */
function addGenLabels(){
  const h2 = d3.hierarchy(rootData, d=>d.children);
  makeTree()(h2);
  const byGen = {};
  h2.descendants().forEach(d=>{ if(!byGen[d.data.gen]) byGen[d.data.gen]=d.y; });
  const genNames = {1:'Đời 1\nCao Tổ',2:'Đời 2',3:'Đời 3',4:'Đời 4',5:'Đời 5',6:'Đời 6',7:'Đời 7',8:'Đời 8'};
  gMain.selectAll('g.genHeaders').remove();
  const xs = h2.descendants().map(d=>d.x);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const headerG = gMain.insert('g',':first-child').attr('class','genHeaders');
  Object.entries(byGen).forEach(([gen,y])=>{
    /* vertical dashed column line */
    headerG.append('line')
      .attr('x1',+y).attr('x2',+y)
      .attr('y1', minX - NH/2 - 20).attr('y2', maxX + NH/2 + 20)
      .attr('stroke','rgba(200,150,12,0.1)').attr('stroke-width','1').attr('stroke-dasharray','4,4');
    /* label above column */
    headerG.append('text')
      .attr('x',+y).attr('y', minX - NH/2 - 24)
      .attr('text-anchor','middle')
      .attr('fill','rgba(200,150,12,0.6)')
      .attr('font-size','11px').attr('font-weight','700')
      .text(genNames[gen]||`Đời ${gen}`);
    /* small underline */
    headerG.append('line')
      .attr('x1',+y-NW/2).attr('x2',+y+NW/2)
      .attr('y1', minX - NH/2 - 14).attr('y2', minX - NH/2 - 14)
      .attr('stroke','rgba(200,150,12,0.25)').attr('stroke-width','1');
  });
}

/* ── resize: keep SVG matching its container ── */
function onResize(){
  const main = document.getElementById('main');
  svg.attr('width', main.clientWidth).attr('height', main.clientHeight);
}
window.addEventListener('resize', ()=>{ onResize(); setTimeout(fitTree,150); });
// Use rAF so layout is fully calculated before we read dimensions
requestAnimationFrame(()=>{ onResize(); setTimeout(fitTree,200); });
</script>
